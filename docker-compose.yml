services:
  db:
    image: mysql:8.4
    container_name: stockflow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stockflow}
      MYSQL_USER: ${DB_USERNAME:-stockflow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - stockflow_db_data:/var/lib/mysql
    networks:
      - stockflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../test-simple-stock-flow-api
      dockerfile: Dockerfile
    container_name: stockflow-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-SimpleStockFlow}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-base64:7n8p2R1vM4Z5k3X9w8Y7t6U5e4R3q2P1o0I9u8Y7t6U=}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-stockflow}
      DB_USERNAME: ${DB_USERNAME:-stockflow_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-stockflow-jwt-super-secret-key-3413974}
    ports:
      - "8000:8000"
    volumes:
      - stockflow_api_vendor:/var/www/html/vendor
      - stockflow_media:/var/www/html/storage/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stockflow-network

  app:
    build:
      context: ../test-simple-stock-flow-app
      dockerfile: Dockerfile
    container_name: stockflow-app
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - stockflow-network

volumes:
  stockflow_db_data:
  stockflow_api_vendor:
  stockflow_media:

networks:
  stockflow-network:
    driver: bridge